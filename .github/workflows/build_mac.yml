name: Build and Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Allows creating releases & uploading assets

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r mac_requirements.txt

      - name: Build app with py2app
        run: python3 setup.py py2app

      - name: Test app entry point
        run: python3 main.py --test

      - name: Sign the app (ad-hoc)
        run: |
          codesign --deep --force --sign - "dist/Mutational Bias.app"

      - name: Compress app as ZIP (macOS-safe)
        run: |
          cd dist
          ditto -c -k --keepParent "Mutational Bias.app" "Mutational Bias-macOS.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mutational\ Bias-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}